<header class="rb-topbar">
    <button class="rb-topbar__menu" type="button" aria-expanded="false" aria-controls="rbAdminSide" data-rb-side-toggle>
        <span class="rb-sr">Toggle management menu</span>
        <span class="rb-nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <div class="rb-topbar__user" data-rb-user hidden>
        <span class="rb-avatar" data-rb-user-initial aria-hidden="true"></span>
        <span class="rb-topbar__name" data-rb-user-name></span>
        <button class="rb-btn rb-btn--ghost rb-btn--sm" type="button" data-rb-signout>Sign out</button>
    </div>
</header>
