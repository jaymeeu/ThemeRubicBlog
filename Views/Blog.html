<section class="rb-blog" data-rb-page="blog">
    <div class="rb-container">
        <header class="rb-blog__head">
            <h1 class="rb-blog__title">Rubic Housing</h1>
        </header>

        <!-- Featured post: filled by Script.js on the unfiltered first page. -->
        <div class="rb-hero-slot" data-rb-hero hidden></div>

        <div class="rb-toolbar">
            <nav class="rb-chips" aria-label="Filter by category" data-rb-chips></nav>
            <form class="rb-search" role="search" data-rb-search-form>
                <label class="rb-sr" for="rbSearch">Search posts</label>
                <input id="rbSearch" class="rb-search__input" type="search" placeholder="Search posts" autocomplete="off" data-rb-search>
            </form>
        </div>

        <p class="rb-status" role="status" aria-live="polite" data-rb-status></p>

        <div class="rb-grid" data-rb-grid aria-busy="true"></div>

        <nav class="rb-pager" aria-label="Pagination" data-rb-pager hidden></nav>
    </div>
</section>
